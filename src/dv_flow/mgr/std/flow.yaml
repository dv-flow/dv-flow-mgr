package:
  name: std
  desc: Standard library providing core tasks, types, and utilities for DV Flow workflows

  fragments:
    - filters.yaml
    - checks.yaml
    - evals.yaml

  tasks:
  - name: Message
    scope: export
    shell: pytask
    run: dv_flow.mgr.std.message.Message
    produces: []
    with:
      msg:
        type: str
        value: ""
  - name: NotProvided
    scope: export
    doc: |
      Declares that a slot does not apply to this project.

      An archetype declares a project interface -- `src-rtl`, `lint-rtl`,
      `tests` -- and a project either fills a slot in or says it has no such
      flow. This is how it says so:

      ```yaml
      - override: lint-rtl
        uses: std.NotProvided
      ```

      The task then does not appear in `dfm run`, because the project does not
      offer that verb; `dfm show task` still reports it, so a reader porting a
      flow between projects can find out why the verb is missing. Naming it
      anyway fails saying the project does not provide it -- not silently
      succeeding, which is the failure `std.check.Implemented` exists to
      prevent, and not complaining that it is unimplemented, which is the wrong
      reason. It satisfies that check, because a slot declared not-provided is
      answered rather than neglected.

      This is deliberately a DECLARATION, not a deletion: it stays in the flow
      file as a statement someone made on purpose, which is what distinguishes
      "this project has no lint flow" from "nobody has got to lint yet".
    shell: pytask
    run: dv_flow.mgr.std.not_provided.NotProvided
    produces: []

  - name: FileSet
    scope: export
    doc: |
      Creates a fileset from a list of files or glob patterns
    shell: pytask
    run: dv_flow.mgr.std.fileset.FileSet
    uptodate: dv_flow.mgr.std.fileset.FileSetUpToDate
    passthrough: all
    consumes: none
    produces:
    # `type:` here is the ITEM type; the fileset's CONTENT type is the task's
    # `type` parameter, which the item calls `filetype`. Propagating it is what
    # lets a consumer require `{type: std.FileSet, filetype: verilogSource}`.
    - type: std.FileSet
      filetype: "${{ type }}"
    with:
      base:
        doc: |
          Specifies the base directory for the fileset.
        type: str
        value: ""
      type:
        doc: |
          Specifies the file type (eg verilogSource) for the fileset.
        type: str
        value: ""
      incdirs:
        type: list
      defines:
        type: list
      attributes:
        type: list
      include:
        doc: |
          Specifies a list of files or a glob pattern for the files to include
        type: list
        value: []
      exclude:
        type: list
        value: []
  - name: CreateFile
    scope: export
    shell: pytask
    run: dv_flow.mgr.std.create_file.CreateFile
    passthrough: all
    consumes: none
    produces:
    - type: std.FileSet
      filetype: "${{ type }}"
    doc: |
      Creates one or more files in the run directory from 
      literal content in the .dv file. Outputs a fileset 
      referencing all the created files.
    with:
      type:
        desc: Content-type to use for the fileset
        type: str
        value: ""
      filename:
        type: str
      content:
        type: str
      incdir: 
        type: bool
        value: false
  - name: SetEnv
    scope: export
    desc: Sets environment variables for use by other tasks
    shell: pytask
    run: dv_flow.mgr.std.setenv.SetEnv
    uptodate: dv_flow.mgr.std.setenv.SetEnvUpToDate
    produces:
    - type: std.Env
    with:
      setenv:
        type: map
      append_path:
        type: map
      prepend_path:
        type: map

  - name: SetFileType
    scope: export
    consumes:
    - type: std.FileSet 
    desc: Outputs all input filesets with the specified filetype
    shell: pytask
    run: dv_flow.mgr.std.set_file_type.SetFileType
    produces:
    - type: std.FileSet
      filetype: "${{ filetype }}"
    with:
      filetype:
        type: str
        value: ""
  - name: IncDirs
    scope: export
    shell: pytask
    run: dv_flow.mgr.std.incdirs.IncDirs
    produces:
    # Carries incdirs only -- no content type to state.
    - type: std.FileSet
    doc: |
      Creates a list of include directories from a set of
      input files.

  - name: PubSet
    scope: export
    consumes:
    - type: std.FileSet
    desc: Binds a placement policy (dest/strip/flatten) to input FileSets
    shell: pytask
    run: dv_flow.mgr.std.publish.PubSetTask
    produces:
    # A PubSet is-a FileSet, so a consumer asking for either matches.
    # `filetype` comes from the input being re-emitted, not from a parameter,
    # so there is nothing statically true to say about it.
    - type: std.PubSet
    doc: |
      Consumes FileSets and emits std.PubSet items that carry a placement
      policy (dest/strip/flatten) for consumption by std.Publish. Use this
      when a single Publish must place different groups of files differently.
    with:
      dest:
        doc: Additive destination sub-path under out/<run-id>.
        type: str
        value: ""
      strip:
        doc: |
          Signed rebase of each file's basedir-relative path:
          >0 drop N leading components; 0 keep; <0 graft basedir tail.
        type: int
        value: 0
      flatten:
        doc: Publish basename only (overrides strip).
        type: bool
        value: false

  - name: Publish
    scope: export
    consumes:
    - type: std.FileSet
    - type: std.PubSet
    passthrough: all
    desc: Copies input FileSets/PubSets into this run's output-data directory
    shell: pytask
    run: dv_flow.mgr.std.publish.Publish
    # Copies files into the output directory; contributes no item of its own.
    # Declared empty rather than left unsaid -- see the note on `produces:`.
    produces: []
    # Publish on every run: a fresh out/<run-id> per invocation. Re-copies are
    # still skipped by content hash when a run-id is reused (--run-id).
    uptodate: false
    doc: |
      Copies the files of consumed FileSets and PubSets into this run's
      output-data directory (rundir/out/<run-id>), recording provenance in
      .dfm-publish.json and detecting when two sources publish conflicting
      content to the same destination path. `dest` composes as a base prefix
      in front of every input's placement; `strip`/`flatten` are the default
      policy for bare FileSet inputs (a PubSet carries its own).
    with:
      dest:
        doc: Additive base prefix under out/<run-id>, joined in front of all inputs.
        type: str
        value: ""
      strip:
        doc: Default rebase for bare FileSet inputs (signed; see PubSet).
        type: int
        value: 0
      flatten:
        doc: Default for bare FileSets — publish basename only.
        type: bool
        value: false
      on_conflict:
        doc: "error | warn | replace | skip (default: error)"
        type: str
        value: "error"
      include:
        doc: Optional glob(s) selecting a subset of each input's files.
        type: list
        value: []

  - name: Agent
    scope: export
    desc: |
      Executes an AI assistant with a specified prompt and collects 
      structured results. The assistant MUST create a valid JSON result
      file or the task will fail.
      
      Supported assistants: Claude Code (claude), GitHub Copilot (copilot),
      OpenAI Codex (codex)

      If no assistant is specified, auto-probes for available assistants
      in priority order: claude, copilot, codex.
    shell: pytask
    run: dv_flow.mgr.std.agent.Agent
    # The agent's result is written to a file, not emitted as a data item.
    produces: []
    with:
      system_prompt:
        type: str
        doc: |
          System prompt template. Can include variable references:
          - ${{ inputs }} - JSON of input data (runtime expansion)
          - ${{ name }} - Task name (runtime expansion)
          - ${{ result_file }} - Expected result filename (runtime expansion)
          Note: These use DV Flow's ${{ }} syntax but are expanded at runtime
          If empty, uses default template.
        value: ""
      user_prompt:
        type: str
        value: ""
        doc: |
          User's prompt content. Combined with system_prompt.
      result_file:
        type: str
        value: ""
        doc: |
          Name of JSON result file (default: {name}.result.json).
          Assistant MUST write valid JSON to this file or task fails.
      assistant:
        type: str
        value: ""
        doc: |
          Override default AI assistant. Options: claude, copilot, codex, openai
          If empty, auto-probes for available assistants (claude > copilot > codex).
      model:
        type: str
        value: ""
        doc: |
          Specify the model to use (e.g., opus, sonnet, gpt-4, o4-mini).
          If empty, uses the assistant's default model.
      sandbox_mode:
        type: str
        value: "off"
        doc: |
          Sandbox mode for Codex assistant. Options:
          - off: No sandboxing (default for workflow execution)
          - read-only: Read-only filesystem access
          - network-disabled: Filesystem access but no network
          - full: Full sandboxing (read-only + no network)
          Note: Only applies to codex assistant.
      approval_mode:
        type: str
        value: "full-auto"
        doc: |
          Approval mode for Codex assistant. Options:
          - suggest: Suggest changes, require approval
          - auto-edit: Auto-edit files, require approval for other actions
          - full-auto: Fully autonomous (default for workflow execution)
          Note: Only applies to codex assistant.
      max_retries:
        type: int
        value: 10
        doc: |
          Maximum number of retry attempts if assistant fails or produces
          empty output. Default: 10
      assistant_config:
        type: map
        doc: |
          Additional assistant-specific configuration.
          For codex: sandbox_mode and approval_mode can also be set here.
          For claude: permission_mode (default: acceptEdits).

  - name: "Null"
    scope: export
    shell: pytask
    run: dv_flow.mgr.std.task_null.TaskNull
    passthrough: all
    consumes: none
    # Forwards its inputs unchanged; adds nothing.
    produces: []
    desc: "No-op task that passes inputs through unchanged"

  - name: RunTasks
    scope: export
    shell: pytask
    run: dv_flow.mgr.std.run_tasks.RunTasks
    produces: []
    doc: |
      Dynamically executes tasks specified by TaskRunSpec input items.
      Tasks are scheduled into the current execution with proper dependencies.
      
      Failure Handling: Uses fail-fast semantics. If any dynamic task fails,
      execution stops immediately and the error is propagated.
      
      Dependencies: TaskRunSpec items can reference both other items in the 
      same batch and currently-executing tasks by name.
    consumes:
    - type: std.TaskRunSpec
    passthrough: all
    with:
      timeout:
        type: float
        doc: Optional timeout in seconds for all dynamic tasks

  - name: TestRunner
    scope: export
    passthrough: all
    consumes: none
    desc: "Base for a test-running root: selection, arguments, and a report"
    doc: |
      Base task for a project's test-execution command. A root `uses:` it,
      wires the available cases and suites as `needs:`, and gets:

        * command-line **selection** (`--tests`, `--views`), applied by pruning
          the need-set at graph build -- a deselected test is never built, and
          neither is anything reachable only through it;
        * an end-of-run **report** of per-case status, with `--detail`
          controlling how much is shown.

      A case declares its identity with a `std.Test` tag. A suite is either a
      matrix task whose cells carry a `name` field (see `test_key`), or a task
      that `uses: std.TestSuite` and lists its members -- tests or further
      suites -- as `needs:`. A test's path is its position in that tree,
      relative to this task (`sanity.reset`); that is what `--tests` matches.
      Needs that are none of these -- an image, a flags item, a helper -- are
      always kept, so selecting tests never breaks the build.

      Selection is deliberately strict: naming a test that does not exist, or a
      selection that matches nothing, is an error rather than a quietly green
      run that tested less than was asked for.
    elaborate: dv_flow.mgr.std.test_select:TestSelect
    summary: dv_flow.mgr.std.test_summary:test_summary
    with:
      tests:
        type: list
        value: []
        cli: {short: t}
        desc: Tests to run, by path pattern (e.g. reset, sanity., uart.fifo_*)
        doc: |
          Tests to run, as path patterns. Empty (the default) runs all of them.
          `reset` matches a test or suite named `reset` anywhere in the tree;
          `sanity.reset` a trailing path; `sanity.` everything under the
          `sanity` suite; a leading `.` anchors at this task; `*` globs within
          one name and `**` across names. Each pattern must match something.
      views:
        type: list
        value: []
        cli: true
        doc: |
          Variants/configurations to run the cases on. Empty runs all of them.
      exclude:
        type: list
        value: []
        cli: {short: x}
        desc: Tests to leave out, by path pattern; applied after --tests
        doc: |
          Path patterns (same syntax as `tests`) for tests to leave out.
          Applied last, so an exclude always wins over a selection.
      build_only:
        type: str
        value: ""
        cli: {name: build-only}
        desc: Build what the selected tests need (producers of PATTERN); run no tests
        doc: |
          Builds the nearest producers of PATTERN that the selected tests
          depend on, and runs none of the tests. PATTERN is a produce pattern:
          `std.FileSet:filetype=simDir`, or just `filetype=simDir`.

          The first half of a split regression: build once here, then run each
          test in its own rundir with `--base-rundir` pointing at this one.
          Producers are built where a normal run would build them, so the
          per-test runs find them instead of rebuilding. `tests-info
          --requires PATTERN` lists the same producers, and the command.
      detail:
        type: str
        value: normal
        cli: true
        doc: Report verbosity.
        values:
        - {value: quiet,  desc: "the headline only"}
        - {value: normal, desc: "the headline, plus every failing case"}
        - {value: full,   desc: "every case, after the generic task summary"}
      test_key:
        type: str
        value: name
        doc: |
          The field in a suite matrix cell that names the case. Cells carrying
          it are what `--tests` selects over.
      view_axis:
        type: str
        value: view
        doc: |
          The suite matrix axis that names the variant. `--views` selects over
          its values.

  - name: TestInfo
    scope: export
    passthrough: none
    consumes: none
    uptodate: false
    desc: "Introspect a test-running root: what cases and views does it offer?"
    doc: |
      The companion to `std.TestRunner`: it reports the inventory the runner
      selects over -- the case names `--tests` accepts and the view names
      `--views` accepts -- and builds nothing.

      The inventory is read off the runner named by `target`, NOT off a
      duplicate `needs:` list; a copy would drift as soon as a suite was added.
      Every need this task declares is dropped at graph build, so introspection
      never triggers a compile.

      ```yaml
      - root: tests-info
        uses: std.TestInfo
        with: { target: tests }
      ```

      It accepts the same selection as the runner (`--tests`, `--views`,
      `--exclude`), resolved by the same code, so `tests-info --tests sanity.`
      lists exactly what `tests --tests sanity.` would run. `--format` (or
      `--json`) picks the output: `text` (the default panel), `json`, `yaml`,
      or `list` -- one test path per line, each accepted back by `--tests`.
      In a machine format the payload is the only thing written to stdout.

      `tests-info.json` is written to the rundir for scripted use.
    shell: pytask
    run: dv_flow.mgr.std.test_info.TestInfoRun
    elaborate: dv_flow.mgr.std.test_info:TestInfo
    summary: dv_flow.mgr.std.test_info:test_info_summary
    with:
      target:
        type: str
        value: tests
        doc: |
          The test-running root to introspect. A bare name resolves in this
          task's own package first, so a base project can write `target: tests`
          once and have it bind in every leaf.
      tests:
        type: list
        value: []
        cli: {short: t}
        desc: Tests to list, by path pattern (same syntax as the runner's)
      views:
        type: list
        value: []
        cli: true
        desc: Views to list (same as the runner's --views)
      exclude:
        type: list
        value: []
        cli: {short: x}
        desc: Tests to leave out, by path pattern
      format:
        type: str
        value: text
        cli: true
        desc: Output format
        values:
        - {value: text, desc: "the inventory panel"}
        - {value: json, desc: "the inventory as JSON"}
        - {value: yaml, desc: "the inventory as YAML"}
        - {value: list, desc: "one --tests selector per line"}
      instances:
        type: bool
        value: false
        cli: true
        desc: List runs (a test on one view) with the dfm arguments for each
        doc: |
          Lists RUNS instead of tests: one entry per test per view, each with
          an `id` and the exact `argv` that runs it alone (`dfm run <target>
          --tests .<path> --views <view>`). The unit a per-test runner
          schedules. `argv` is `[run, <target>, <selection args>...]` and
          carries only the selection: insert run options (`--clean`, `-c`)
          after `run`, and pass `-D` and project flags the same way they were
          passed here.
          With `--format list`, each line is the selection arguments of one
          run.
      requires:
        type: str
        value: ""
        cli: true
        desc: Report the producers of PATTERN each run needs (implies --instances)
        doc: |
          The build fan-in of the selection. PATTERN is a produce pattern:
          `std.FileSet:filetype=simDir`, or just `filetype=simDir`. Each run
          gets `requires`, the nearest producers of PATTERN its data comes
          from; `producers` lists each one once, with the runs that need it;
          `build.argv` builds them all, and runs no test (the target's
          `--build-only`).

          This builds the target's graph (nothing executes), because which
          producer a run uses is often decided at graph build. Producers are
          found from `produces:` declarations, so a producer that does not
          declare its output is missed; a run with no producer is warned about.
      as_json:
        # Not `json`: that name shadows an attribute of the params model.
        type: bool
        value: false
        cli: {name: json}
        desc: Shorthand for --format json
      test_key:
        type: str
        value: name
        doc: |
          The field in a suite matrix cell that names the case. Must match the
          target runner's `test_key`.
      view_axis:
        type: str
        value: view
        doc: |
          The suite matrix axis that names the variant. Must match the target
          runner's `view_axis`.
      inventory:
        type: str
        value: ""
        doc: |
          Set by the elaborator: the enumerated inventory, as JSON. Not a user
          parameter.

  - name: TestSuite
    scope: export
    passthrough: all
    consumes: none
    desc: "A named collection of tests and suites"
    doc: |
      Groups tests -- and other suites -- under one name. The members are the
      task's `needs:`; a suite that contains suites is a super-suite, and
      nothing else distinguishes it.

      ```yaml
      - name: sanity
        uses: std.TestSuite
        needs: [reset, csr-rw, fifo-suite]
      ```

      The suite's name (the task's own name, or `name:` on a `std.TestSuite`
      tag) becomes a segment of each member's test path, so
      `dfm run tests --tests sanity.` selects everything in it. Run directly,
      a suite simply runs all its members; selection happens in the
      `std.TestRunner` that reaches it.

  types:
  - name: Check
    doc: |
      Base type for graph-build task requirements. Derive from it and bind an
      implementation with `check: module:function`.
    with:
      severity:
        type: str
        value: error
        values:
        - {value: error,   desc: "fails the build"}
        - {value: warning, desc: "reported, the build continues"}
        - {value: "off",   desc: "not evaluated"}
        doc: |
          How a violation is reported. `off` is the documented way for a
          project that cannot satisfy an inherited requirement to say so: it
          leaves an auditable record in the flow file, which a silent pass or a
          command-line flag would not.
      id:
        type: str
        value: ""
        doc: |
          Distinguishes two instances of the same check type on one task.
          Requirements are accumulated along the `uses:` chain with
          nearest-wins per (check type, id), so an `id` is what lets a task
          carry two different `std.check.Needs` requirements -- and what lets a
          derived task replace one of them without touching the other.
      hint:
        type: str
        value: ""
        doc: |
          Remediation text shown verbatim after the generic diagnostic. This is
          where the author of a requirement writes the lines the reader should
          actually type.

  - name: Tag
    doc: |
      Base type for all tags. Tags are used to categorize and filter tasks and packages.
    with:
      category:
        type: str
        value: ""
      value:
        type: str
        value: ""

  - name: Stable
    uses: std.Tag
    doc: |
      Declares that a task's name, parameters and outputs are settled: a
      project may depend on them and expect a deprecation cycle before they
      change. This is the assumed state of an untagged task, so tag with it
      only where saying so out loud is worth the noise -- typically alongside
      `std.Experimental` siblings, to mark which of a set is the safe one.
    with:
      since:
        type: str
        value: ""
        doc: Version at which this task became stable (free-form, e.g. "1.4")

  - name: Experimental
    uses: std.Tag
    doc: |
      Declares that a task may change or disappear without a deprecation
      cycle. Use it to ship something useful before its interface has settled;
      it is a promise about churn, not a claim that the task is broken.
    with:
      reason:
        type: str
        value: ""
        doc: >
          What is still unsettled, so a reader can judge the risk of depending
          on it (e.g. "parameter names likely to change").

  - name: Deprecated
    uses: std.Tag
    doc: |
      Declares that a task should no longer be used and names what to use
      instead. The task still works -- deprecation is a message to whoever
      reads or maintains the flow file, not a runtime failure.
    with:
      reason:
        type: str
        value: ""
        doc: Why the task is deprecated, in the author's words
      replacement:
        type: str
        value: ""
        doc: >
          Name of the task to use instead. Empty when there is no replacement,
          which is itself worth saying.
      since:
        type: str
        value: ""
        doc: Version at which this task was deprecated (free-form, e.g. "1.4")

  - name: Test
    uses: std.Tag
    doc: |
      Marks a task as a test case and gives it the identity `std.TestRunner`
      selects on. `name` is its segment in the test path (`sanity.reset`),
      defaulting to the task's own name; `case` is the older spelling of the
      same thing. `view` is the variant it runs on, when a project has more
      than one.
    with:
      name:
        type: str
        value: ""
      desc:
        type: str
        value: ""
      case:
        type: str
        value: ""
      view:
        type: str
        value: ""
      group:
        type: str
        value: ""

  - name: TestSuite
    uses: std.Tag
    doc: |
      Marks a task as a test suite. On a matrix task whose cells carry a
      `name`, it names the suite (`name`, defaulting to the task's own name);
      on any other task, the task's `needs:` are the suite's members.
      `uses: std.TestSuite` is the usual way to declare a collector suite.
    with:
      name:
        type: str
        value: ""
      desc:
        type: str
        value: ""

  - name: AgentSkillTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as useful agent skills. Agent skills are 
      capabilities that can be discovered and utilized by AI agents to 
      perform specialized tasks.

  - name: AgentToolTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as containing tool definitions

  - name: AgentPersonaTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as containing a persona

  - name: AgentReferenceTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as containing references

  - name: ResourceTag
    uses: std.Tag
    doc: |
      Declares compute resource requirements for a task.
      Used by cluster runners (LSF, SLURM) to select appropriate
      worker nodes. Ignored by the local runner.
    with:
      cores:
        type: int
        value: 1
        doc: Number of CPU cores required
      memory:
        type: str
        value: "1G"
        doc: Memory requirement with unit suffix (e.g. "512M", "2G", "32G")
      queue:
        type: str
        value: ""
        doc: Target queue name (empty = use default)
      walltime:
        type: str
        value: "1:00"
        doc: Maximum walltime (HH:MM format)
      resource_class:
        type: str
        value: ""
        doc: Named resource class (overrides cores/memory if set)

  - name: DataItem
    with:
      type:
        type: str

  - name: FileSet
    uses: std.DataItem
    with:
      filetype:
        type: str
        value: ""
      basedir:
        type: str
      files:
        type:
          list:
            item: str
      incdirs:
        type:
          list:
            item: str
      defines:
        type:
          list:
            item: str
      attributes:
        type:
          list:
            item: str

  - name: PubSet
    uses: std.FileSet
    doc: |
      A FileSet that carries a placement policy for std.Publish: the files map
      to destinations under out/<run-id> via dest/strip/flatten (see std.Publish).
    with:
      dest:
        type: str
        value: ""
      strip:
        type: int
        value: 0
      flatten:
        type: bool
        value: false

  - name: Env
    doc: |
      Environment variables
    with:
      vals:
        type:
          map:
            key:
              type: str
            val:
              type: str
      append_path:
        doc: |
          Path elements to append to existing environment variables
        type:
          map:
            key:
              type: str
            val:
              type: str
      prepend_path:
        doc: |
          Path elements to prepend to existing environment variables
        type:
          map:
            key:
              type: str
            val:
              type: str

  - name: AgentResource
    uses: std.DataItem
    doc: |
      Base dataset type for agent skills, tools, references, and personas.
      Provides common fields for specifying content via files, inline content, or URLs.
    with:
      files:
        type: list
        doc: |
          List of files to include in this resource
      content:
        type: str
        doc: |
          Inline content for this resource
      urls:
        type: list
        doc: |
          URLs pointing to external resources

  - name: AgentSkill
    uses: std.AgentResource
    doc: |
      Defines an agent skill dataset. Agent skills represent capabilities 
      that AI agents can discover and utilize to perform specialized tasks.
      
      Packages should define an AgentSkill type that uses std.AgentSkill
      to expose their capabilities to LLM agents. The skill documentation
      should be provided in a skill.md file.
    tags: [std.AgentSkillTag]

  - name: AgentPersona
    uses: std.DataItem
    doc: |
      Specifies a persona
    tags: [std.AgentPersonaTag]
    with:
      persona:
        type: str

  - name: AgentTool
    uses: std.DataItem
    doc: |
      Specifies a URL or set of files that specify an MCP server to use
    tags: [std.AgentToolTag]
    with:
      command:
        type: str
      args:
        type: list
      url: 
        type: str

  - name: AgentReference
    uses: std.AgentResource
    doc: |
      Specifies a set of files or URLs for an agent to use as reference
    tags: [std.AgentReferenceTag]

  - name: TaskRunSpec
    uses: std.DataItem
    doc: |
      Specification for dynamically executing a task during runtime.
      Can be produced by tasks and consumed by std.RunTasks.
      
      Dependencies: The needs field can reference both batch-local tasks
      (other TaskRunSpec items in the same batch) and inflight tasks 
      (currently-executing tasks from the static graph).
    with:
      task_type:
        type: str
        doc: Task type name (e.g., "std.Message", "my_pkg.compile")
      task_name:
        type: str
        value: ""
        doc: Optional task name. If empty, auto-generated.
      params:
        type: map
        doc: Parameter overrides for the task
      needs:
        type: list
        doc: List of task names this task depends on (batch-local or inflight)
