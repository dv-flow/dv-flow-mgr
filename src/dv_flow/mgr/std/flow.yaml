package:
  name: std
  desc: Standard library providing core tasks, types, and utilities for DV Flow workflows

  fragments:
    - filters.yaml

  tasks:
  - name: Message
    shell: pytask
    run: dv_flow.mgr.std.message.Message
    with:
      msg:
        type: str
        value: ""
  - name: FileSet
    doc: |
      Creates a fileset from a list of files or glob patterns
    shell: pytask
    run: dv_flow.mgr.std.fileset.FileSet
    uptodate: dv_flow.mgr.std.fileset.FileSetUpToDate
    passthrough: all
    consumes: none
    with:
      base:
        doc: |
          Specifies the base directory for the fileset.
        type: str
        value: ""
      type:
        doc: |
          Specifies the file type (eg verilogSource) for the fileset.
        type: str
        value: ""
      incdirs:
        type: list
      defines:
        type: list
      attributes:
        type: list
      include:
        doc: |
          Specifies a list of files or a glob pattern for the files to include
        type: list
        value: []
      exclude:
        type: list
        value: []
  - name: CreateFile
    shell: pytask
    run: dv_flow.mgr.std.create_file.CreateFile
    passthrough: all
    consumes: none
    doc: |
      Creates one or more files in the run directory from 
      literal content in the .dv file. Outputs a fileset 
      referencing all the created files.
    with:
      type:
        desc: Content-type to use for the fileset
        type: str
        value: ""
      filename:
        type: str
      content:
        type: str
      incdir: 
        type: bool
        value: false
  - name: SetEnv
    desc: Sets environment variables for use by other tasks
    shell: pytask
    run: dv_flow.mgr.std.setenv.SetEnv
    uptodate: dv_flow.mgr.std.setenv.SetEnvUpToDate
    with:
      setenv:
        type: map
      append_path:
        type: map
      prepend_path:
        type: map

  - name: SetFileType
    consumes:
    - type: std.FileSet 
    desc: Outputs all input filesets with the specified filetype
    shell: pytask
    run: dv_flow.mgr.std.set_file_type.SetFileType
    with:
      filetype:
        type: str
        value: ""
  - name: IncDirs
    shell: pytask
    run: dv_flow.mgr.std.incdirs.IncDirs
    doc: |
      Creates a list of include directories from a set of
      input files.

  - name: PubSet
    consumes:
    - type: std.FileSet
    desc: Binds a placement policy (dest/strip/flatten) to input FileSets
    shell: pytask
    run: dv_flow.mgr.std.publish.PubSetTask
    doc: |
      Consumes FileSets and emits std.PubSet items that carry a placement
      policy (dest/strip/flatten) for consumption by std.Publish. Use this
      when a single Publish must place different groups of files differently.
    with:
      dest:
        doc: Additive destination sub-path under out/<run-id>.
        type: str
        value: ""
      strip:
        doc: |
          Signed rebase of each file's basedir-relative path:
          >0 drop N leading components; 0 keep; <0 graft basedir tail.
        type: int
        value: 0
      flatten:
        doc: Publish basename only (overrides strip).
        type: bool
        value: false

  - name: Publish
    consumes:
    - type: std.FileSet
    - type: std.PubSet
    passthrough: all
    desc: Copies input FileSets/PubSets into this run's output-data directory
    shell: pytask
    run: dv_flow.mgr.std.publish.Publish
    # Publish on every run: a fresh out/<run-id> per invocation. Re-copies are
    # still skipped by content hash when a run-id is reused (--run-id).
    uptodate: false
    doc: |
      Copies the files of consumed FileSets and PubSets into this run's
      output-data directory (rundir/out/<run-id>), recording provenance in
      .dfm-publish.json and detecting when two sources publish conflicting
      content to the same destination path. `dest` composes as a base prefix
      in front of every input's placement; `strip`/`flatten` are the default
      policy for bare FileSet inputs (a PubSet carries its own).
    with:
      dest:
        doc: Additive base prefix under out/<run-id>, joined in front of all inputs.
        type: str
        value: ""
      strip:
        doc: Default rebase for bare FileSet inputs (signed; see PubSet).
        type: int
        value: 0
      flatten:
        doc: Default for bare FileSets — publish basename only.
        type: bool
        value: false
      on_conflict:
        doc: "error | warn | replace | skip (default: error)"
        type: str
        value: "error"
      include:
        doc: Optional glob(s) selecting a subset of each input's files.
        type: list
        value: []

  - name: Agent
    desc: |
      Executes an AI assistant with a specified prompt and collects 
      structured results. The assistant MUST create a valid JSON result
      file or the task will fail.
      
      Supported assistants: GitHub Copilot (copilot), OpenAI Codex (codex)
      
      If no assistant is specified, auto-probes for available assistants
      in priority order: copilot, codex.
    shell: pytask
    run: dv_flow.mgr.std.agent.Agent
    with:
      system_prompt:
        type: str
        doc: |
          System prompt template. Can include variable references:
          - ${{ inputs }} - JSON of input data (runtime expansion)
          - ${{ name }} - Task name (runtime expansion)
          - ${{ result_file }} - Expected result filename (runtime expansion)
          Note: These use DV Flow's ${{ }} syntax but are expanded at runtime
          If empty, uses default template.
        value: ""
      user_prompt:
        type: str
        value: ""
        doc: |
          User's prompt content. Combined with system_prompt.
      result_file:
        type: str
        value: ""
        doc: |
          Name of JSON result file (default: {name}.result.json).
          Assistant MUST write valid JSON to this file or task fails.
      assistant:
        type: str
        value: ""
        doc: |
          Override default AI assistant. Options: copilot, codex, openai, claude
          If empty, auto-probes for available assistants (copilot > codex).
      model:
        type: str
        value: ""
        doc: |
          Specify the model to use (e.g., gpt-4, o4-mini, claude-3-opus). 
          If empty, uses the assistant's default model.
      sandbox_mode:
        type: str
        value: "off"
        doc: |
          Sandbox mode for Codex assistant. Options:
          - off: No sandboxing (default for workflow execution)
          - read-only: Read-only filesystem access
          - network-disabled: Filesystem access but no network
          - full: Full sandboxing (read-only + no network)
          Note: Only applies to codex assistant.
      approval_mode:
        type: str
        value: "full-auto"
        doc: |
          Approval mode for Codex assistant. Options:
          - suggest: Suggest changes, require approval
          - auto-edit: Auto-edit files, require approval for other actions
          - full-auto: Fully autonomous (default for workflow execution)
          Note: Only applies to codex assistant.
      max_retries:
        type: int
        value: 10
        doc: |
          Maximum number of retry attempts if assistant fails or produces
          empty output. Default: 10
      assistant_config:
        type: map
        doc: |
          Additional assistant-specific configuration.
          For codex: sandbox_mode and approval_mode can also be set here.

  - name: "Null"
    shell: pytask
    run: dv_flow.mgr.std.task_null.TaskNull
    passthrough: all
    consumes: none
    desc: "No-op task that passes inputs through unchanged"

  - name: RunTasks
    shell: pytask
    run: dv_flow.mgr.std.run_tasks.RunTasks
    doc: |
      Dynamically executes tasks specified by TaskRunSpec input items.
      Tasks are scheduled into the current execution with proper dependencies.
      
      Failure Handling: Uses fail-fast semantics. If any dynamic task fails,
      execution stops immediately and the error is propagated.
      
      Dependencies: TaskRunSpec items can reference both other items in the 
      same batch and currently-executing tasks by name.
    consumes:
    - type: std.TaskRunSpec
    passthrough: all
    with:
      timeout:
        type: float
        doc: Optional timeout in seconds for all dynamic tasks

  - name: TestRunner
    passthrough: all
    consumes: none
    desc: "Base for a test-running root: selection, arguments, and a report"
    doc: |
      Base task for a project's test-execution command. A root `uses:` it,
      wires the available cases and suites as `needs:`, and gets:

        * command-line **selection** (`--tests`, `--views`), applied by pruning
          the need-set at graph build -- a deselected test is never built, and
          neither is anything reachable only through it;
        * an end-of-run **report** of per-case status, with `--detail`
          controlling how much is shown.

      A case declares its identity with a `std.Test` tag; a suite is a matrix
      task whose cells carry a `name` field (see `test_key`). Needs that are
      neither -- an image, a flags item, a helper -- are always kept, so
      selecting tests never breaks the build.

      Selection is deliberately strict: naming a test that does not exist, or a
      selection that matches nothing, is an error rather than a quietly green
      run that tested less than was asked for.
    elaborate: dv_flow.mgr.std.test_select:TestSelect
    summary: dv_flow.mgr.std.test_summary:test_summary
    cli:
      args:
      - name: tests
        short: t
      - name: views
      - name: detail
    with:
      tests:
        type: list
        value: []
        doc: |
          Cases to run, by name. Empty (the default) runs all of them.
      views:
        type: list
        value: []
        doc: |
          Variants/configurations to run the cases on. Empty runs all of them.
      detail:
        type: str
        value: normal
        doc: Report verbosity.
        values:
        - {value: quiet,  desc: "the headline only"}
        - {value: normal, desc: "the headline, plus every failing case"}
        - {value: full,   desc: "every case, after the generic task summary"}
      test_key:
        type: str
        value: name
        doc: |
          The field in a suite matrix cell that names the case. Cells carrying
          it are what `--tests` selects over.
      view_axis:
        type: str
        value: view
        doc: |
          The suite matrix axis that names the variant. `--views` selects over
          its values.

  - name: TestInfo
    passthrough: none
    consumes: none
    uptodate: false
    desc: "Introspect a test-running root: what cases and views does it offer?"
    doc: |
      The companion to `std.TestRunner`: it reports the inventory the runner
      selects over -- the case names `--tests` accepts and the view names
      `--views` accepts -- and builds nothing.

      The inventory is read off the runner named by `target`, NOT off a
      duplicate `needs:` list; a copy would drift as soon as a suite was added.
      Every need this task declares is dropped at graph build, so introspection
      never triggers a compile.

      ```yaml
      - root: tests-info
        uses: std.TestInfo
        with: { target: tests }
      ```

      `tests-info.json` is written to the rundir for scripted use; the console
      report is the same data.
    shell: pytask
    run: dv_flow.mgr.std.test_info.TestInfoRun
    elaborate: dv_flow.mgr.std.test_info:TestInfo
    summary: dv_flow.mgr.std.test_info:test_info_summary
    with:
      target:
        type: str
        value: tests
        doc: |
          The test-running root to introspect. A bare name resolves in this
          task's own package first, so a base project can write `target: tests`
          once and have it bind in every leaf.
      test_key:
        type: str
        value: name
        doc: |
          The field in a suite matrix cell that names the case. Must match the
          target runner's `test_key`.
      view_axis:
        type: str
        value: view
        doc: |
          The suite matrix axis that names the variant. Must match the target
          runner's `view_axis`.
      inventory:
        type: str
        value: ""
        doc: |
          Set by the elaborator: the enumerated inventory, as JSON. Not a user
          parameter.

  types:
  - name: Tag
    doc: |
      Base type for all tags. Tags are used to categorize and filter tasks and packages.
    with:
      category:
        type: str
        value: ""
      value:
        type: str
        value: ""

  - name: Test
    uses: std.Tag
    doc: |
      Marks a task as a test case and gives it the identity `std.TestRunner`
      selects on. `case` is the short name the user types (`--tests arb`);
      `view` is the variant it runs on, when a project has more than one.
    with:
      case:
        type: str
        value: ""
      view:
        type: str
        value: ""
      group:
        type: str
        value: ""

  - name: AgentSkillTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as useful agent skills. Agent skills are 
      capabilities that can be discovered and utilized by AI agents to 
      perform specialized tasks.

  - name: AgentToolTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as containing tool definitions

  - name: AgentPersonaTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as containing a persona

  - name: AgentReferenceTag
    uses: std.Tag
    doc: |
      Tag that marks datasets as containing references

  - name: ResourceTag
    uses: std.Tag
    doc: |
      Declares compute resource requirements for a task.
      Used by cluster runners (LSF, SLURM) to select appropriate
      worker nodes. Ignored by the local runner.
    with:
      cores:
        type: int
        value: 1
        doc: Number of CPU cores required
      memory:
        type: str
        value: "1G"
        doc: Memory requirement with unit suffix (e.g. "512M", "2G", "32G")
      queue:
        type: str
        value: ""
        doc: Target queue name (empty = use default)
      walltime:
        type: str
        value: "1:00"
        doc: Maximum walltime (HH:MM format)
      resource_class:
        type: str
        value: ""
        doc: Named resource class (overrides cores/memory if set)

  - name: DataItem
    with:
      type:
        type: str

  - name: FileSet
    uses: std.DataItem
    with:
      filetype:
        type: str
        value: ""
      basedir:
        type: str
      files:
        type:
          list:
            item: str
      incdirs:
        type:
          list:
            item: str
      defines:
        type:
          list:
            item: str
      attributes:
        type:
          list:
            item: str

  - name: PubSet
    uses: std.FileSet
    doc: |
      A FileSet that carries a placement policy for std.Publish: the files map
      to destinations under out/<run-id> via dest/strip/flatten (see std.Publish).
    with:
      dest:
        type: str
        value: ""
      strip:
        type: int
        value: 0
      flatten:
        type: bool
        value: false

  - name: Env
    doc: |
      Environment variables
    with:
      vals:
        type:
          map:
            key:
              type: str
            val:
              type: str
      append_path:
        doc: |
          Path elements to append to existing environment variables
        type:
          map:
            key:
              type: str
            val:
              type: str
      prepend_path:
        doc: |
          Path elements to prepend to existing environment variables
        type:
          map:
            key:
              type: str
            val:
              type: str

  - name: AgentResource
    uses: std.DataItem
    doc: |
      Base dataset type for agent skills, tools, references, and personas.
      Provides common fields for specifying content via files, inline content, or URLs.
    with:
      files:
        type: list
        doc: |
          List of files to include in this resource
      content:
        type: str
        doc: |
          Inline content for this resource
      urls:
        type: list
        doc: |
          URLs pointing to external resources

  - name: AgentSkill
    uses: std.AgentResource
    doc: |
      Defines an agent skill dataset. Agent skills represent capabilities 
      that AI agents can discover and utilize to perform specialized tasks.
      
      Packages should define an AgentSkill type that uses std.AgentSkill
      to expose their capabilities to LLM agents. The skill documentation
      should be provided in a skill.md file.
    tags: [std.AgentSkillTag]

  - name: AgentPersona
    uses: std.DataItem
    doc: |
      Specifies a persona
    tags: [std.AgentPersonaTag]
    with:
      persona:
        type: str

  - name: AgentTool
    uses: std.DataItem
    doc: |
      Specifies a URL or set of files that specify an MCP server to use
    tags: [std.AgentToolTag]
    with:
      command:
        type: str
      args:
        type: list
      url: 
        type: str

  - name: AgentReference
    uses: std.AgentResource
    doc: |
      Specifies a set of files or URLs for an agent to use as reference
    tags: [std.AgentReferenceTag]

  - name: TaskRunSpec
    uses: std.DataItem
    doc: |
      Specification for dynamically executing a task during runtime.
      Can be produced by tasks and consumed by std.RunTasks.
      
      Dependencies: The needs field can reference both batch-local tasks
      (other TaskRunSpec items in the same batch) and inflight tasks 
      (currently-executing tasks from the static graph).
    with:
      task_type:
        type: str
        doc: Task type name (e.g., "std.Message", "my_pkg.compile")
      task_name:
        type: str
        value: ""
        doc: Optional task name. If empty, auto-generated.
      params:
        type: map
        doc: Parameter overrides for the task
      needs:
        type: list
        doc: List of task names this task depends on (batch-local or inflight)
