# dv-flow/dv-flow-mgr -- Forgejo Actions.
#
# THIS FILE'S FIRST JOB IS TO EXIST. When .forgejo/workflows/ is absent the
# Forgejo runner falls back to running .github/workflows/ -- measured on this
# instance, not assumed. That file calls
#   dv-flow/dv-flow-release/.github/workflows/dv-flow-pybuild.yml@main
# which is a GitHub reusable workflow: `uses:` here resolves against
# code.forgejo.org, not github.com, so the fallback could only ever have failed
# on its first step. Existing is what stops it trying.
#
# WHY THIS IS A CHECK AND NOT A MIRROR OF THE BUILD. The real build fetches
# dependencies with `ivpm update -a`, which clones sibling repositories over the
# network. Reproducing that here would make every push depend on github.com
# being reachable, to test nothing this repo controls.
#
# What it checks instead is THE CONTRACT WITH THE SHARED WORKFLOW, which is
# otherwise unchecked anywhere and fails silently when broken. dfm keeps its
# version in ONE place, src/dv_flow/mgr/__version__.py, and pyproject.toml
# reads it (`dynamic = ["version"]`). When <version_dir>/__version__.py exists
# the shared workflow reads BASE from it and stamps the suffix with:
#
#   sed -i -e 's%^SUFFIX *= *".*"%SUFFIX = "${suffix}"%' <version_dir>/__version__.py
#
# and leaves pyproject.toml alone. So the file must carry a literal BASE and
# SUFFIX in that shape, and pyproject.toml must not declare a version of its own
# -- a second copy is how `__version__` came to say 1.5.0 while the package was
# at 1.12.0.
#
# THERE IS DELIBERATELY NO PUBLISH JOB. Releases for this repo run on GitHub
# through the shared workflow, sync-policy.toml records authority as `github`,
# and PYPI_API_TOKEN is a GitHub org secret. All three agree, which is what
# distinguishes this from the peakrdl-pss anti-pattern -- that one was wrong
# because the policy claimed GitHub while only Forgejo could publish.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check for internal identifiers in tracked files
      # This repo is published to git.dvkit.org, so anything committed here is
      # public. Internal host names, tailnet addresses and CGNAT-range IPs must
      # not appear in tracked files -- if a build ever needs one, it belongs in
      # a repository secret, which is masked in logs.
      #
      # The pathspec excludes the WHOLE .forgejo/workflows directory, not just
      # this file. Excluding only itself is what made four edapack repos red for
      # a day: with two workflows present, each matched the OTHER's copy of this
      # very pattern. docs.yml carries the same check, so this repo has two.
      run: |
        pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: The shared workflow reference must still resolve
      # The caller pins a BRANCH, not a SHA, so this is not a version check --
      # it is a check that the path has not been edited to something that will
      # 404 at run time. GitHub reports a missing reusable workflow per caller,
      # at the moment of the run, and never in the repo that moved it.
      run: |
        want='dv-flow/dv-flow-release/.github/workflows/dv-flow-pybuild.yml@main'
        if ! grep -qF "$want" .github/workflows/ci.yml; then
          echo "::error::.github/workflows/ci.yml no longer references $want"
          echo "If that is deliberate, this check and the repo's release path both need updating."
          exit 1
        fi
        echo "OK: calls $want"

    - name: The version stamp the shared workflow applies must have something to bite on
      run: |
        vd='src/dv_flow/mgr'
        vfile="$vd/__version__.py"
        rc=0

        if [ ! -f "$vfile" ]; then
          echo "::error::$vfile does not exist; it is dfm's one version source"
          exit 1
        fi

        # Read with the SAME pipeline the shared workflow uses: what matters is
        # what that sed will see.
        version=$(sed -n -e 's%^BASE *= *"\([^"][^"]*\)".*$%\1%p' "$vfile")
        if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+'; then
          echo "::error::cannot read BASE from $vfile (got '$version')"
          rc=1
        else
          echo "OK: $vfile declares BASE $version"
        fi
        if ! grep -qE '^SUFFIX *= *"' "$vfile"; then
          echo "::error::$vfile has no SUFFIX = \"...\" line for the stamp to rewrite"
          rc=1
        else
          echo "OK: $vfile carries the SUFFIX line the stamp rewrites"
        fi

        if grep -qE '^version *= *"' pyproject.toml; then
          echo "::error::pyproject.toml declares a version; it must read $vfile instead"
          rc=1
        elif ! grep -qF 'attr = "dv_flow.mgr.__version__._pkg_version"' pyproject.toml; then
          echo "::error::pyproject.toml does not read its version from $vfile"
          rc=1
        else
          echo "OK: pyproject.toml reads the version from $vfile"
        fi

        exit $rc
