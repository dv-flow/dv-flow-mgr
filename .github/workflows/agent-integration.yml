name: Agent Integration Test

on:
  push:
    branches:
      - mballance/native-agent
      - main
  workflow_dispatch:
    inputs:
      model:
        description: "LiteLLM model to test (default: openai/gpt-4o-mini via GitHub Models)"
        required: false
        default: "openai/gpt-4o-mini"

# models: read allows the GITHUB_TOKEN to call the GitHub Models API.
#
# HEADS UP: GitHub Models is being retired, so this job no longer proves the
# agent can reach a live model — the test SKIPS on provider-unavailability
# instead of failing. A green run here is therefore not evidence of working
# agent/LLM integration; check the skip reason in the log. See the PROVIDER
# STATUS block in tests/unit/test_native_agent_live.py for what restoring real
# coverage requires.
permissions:
  contents: read
  models: read

jobs:
  agent-integration:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_TEST_MODEL: ${{ inputs.model || 'openai/gpt-4o-mini' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          python3 -m venv packages/python
          ./packages/python/bin/pip install --upgrade pip
          ./packages/python/bin/pip install -e ".[agent]" pytest pyyaml

      - name: Run live agent integration test
        run: |
          export PYTHONPATH=$(pwd)/src
          ./packages/python/bin/pytest tests/unit/test_native_agent_live.py -v
